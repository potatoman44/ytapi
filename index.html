<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAVE ONE SONG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Limelight&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffc21a;--gold2:#e8a92a;--ink:#f4efe6;--bg:#0c0c0d;--card:#121213;--line:#e9e4da}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.03em;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
/* background vinyls */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 120%,#1a1426 0,transparent 55%),radial-gradient(ellipse at 50% -20%,#1a1712 0,transparent 50%)}
.vinyl{position:absolute;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#151515 2px 4px);box-shadow:0 0 0 1px #1d1d1d inset;animation:spin 40s linear infinite}
.vinyl::before{content:"";position:absolute;inset:18%;border-radius:50%;border:3px solid #232323}
.vinyl::after{content:"";position:absolute;inset:34%;border-radius:50%;border:26px solid var(--ring);opacity:.55}
.v1{width:460px;height:460px;left:-20px;top:60px;--ring:#a97c1f}
.v2{width:420px;height:420px;right:-30px;top:290px;--ring:#6b2222;animation-duration:55s}
@keyframes spin{to{transform:rotate(360deg)}}
.app{position:relative;z-index:1;min-height:100vh}
.gold-title{font-family:'Limelight',Georgia,serif;background:linear-gradient(180deg,#fff6d8 0%,#f7d37a 35%,#d99a2b 70%,#b8741f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,180,60,.35)) drop-shadow(0 3px 0 rgba(0,0,0,.6));letter-spacing:.02em;line-height:1}
/* MENU */
.menu{display:flex;flex-direction:column;align-items:center;padding:22px 16px 60px}
.pills{display:flex;gap:4px;border:1.5px solid #3a3a3a;border-radius:999px;padding:5px;background:rgba(15,15,15,.8)}
.pills span{padding:8px 18px;border-radius:999px;font-size:19px;color:#ddd}
.pills span.on{background:var(--gold);color:#111}
.src{margin-top:16px;display:flex;gap:12px}
.src span{border:1.5px solid var(--line);border-radius:6px;padding:12px 26px;font-size:22px;color:#f3d79a;background:#150f0b;min-width:240px;text-align:center}
.src span.on{background:var(--gold);color:#111;border-color:#fff2c0}
.menu h1{font-size:clamp(70px,13vw,128px);margin:52px 0 46px;text-align:center}
.mbtns{display:flex;flex-direction:column;gap:10px;width:min(420px,92vw)}
.mbtn{border:2px solid var(--line);border-radius:6px;padding:11px;font-size:28px;color:var(--gold);background:rgba(12,12,12,.85);transition:.15s}
.mbtn:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(255,194,26,.25)}
.mbtn.primary{background:var(--gold);color:#111;border-color:var(--gold)}
.mbtn small{display:block;font-size:15px;color:#ddd}
/* GAME */
.top{position:fixed;top:0;left:0;right:0;height:92px;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none}
.top>*{pointer-events:auto}
.fast{position:fixed;left:20px;top:20px;display:flex;align-items:center;gap:10px;border:1.5px solid #4a4a4a;border-radius:999px;padding:8px 16px 8px 10px;font-size:18px;background:rgba(12,12,12,.8);z-index:6}
.tog{width:40px;height:22px;border-radius:99px;background:#3a3a3a;position:relative;transition:.2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#eee;transition:.2s}
.fast.on .tog{background:var(--gold)}.fast.on .tog::after{left:21px;background:#111}
.close{position:fixed;right:20px;top:20px;width:46px;height:46px;border-radius:50%;border:1.5px solid #555;display:grid;place-items:center;font-size:22px;background:rgba(12,12,12,.8);z-index:6}
.close:hover{border-color:#ddd}
.year{font-size:64px}
.sub{font-size:15px;color:#ddd;text-align:center;margin-top:-4px}
.stage{padding:96px 24px 110px;max-width:1300px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px 24px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}.year{font-size:46px}.v1,.v2{opacity:.5}}
.card{display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(14px) scale(.97);transition:opacity .35s,transform .35s}
.card.in{opacity:1;transform:none}
.cv{position:relative;aspect-ratio:1;border-radius:14px;background:#f2efe8;padding:7px;transition:background .2s,box-shadow .2s;cursor:pointer}
.cv.playing{background:var(--gold);box-shadow:0 0 26px rgba(255,194,26,.45)}
.cv img{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block;background:#222}
.cv .ph{width:100%;height:100%;border-radius:7px;background:#1b1b1b;display:grid;place-items:center;color:#555;font-size:44px}
.pp{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;background:rgba(10,10,10,.82);display:grid;place-items:center;border:1.5px solid rgba(255,194,26,.6)}
.pp svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linejoin:round}
.pp.na{opacity:.35}
.pp.ld svg{display:none}.pp.ld::after{content:"";width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,194,26,.3);border-top-color:var(--gold);animation:spin .8s linear infinite}
.yt{position:absolute;left:14px;bottom:14px;height:26px;padding:0 8px;border-radius:6px;background:rgba(10,10,10,.82);font-size:14px;display:grid;place-items:center;color:#ff5a5a;border:1px solid rgba(255,90,90,.5);opacity:0;transition:.15s}
.cv:hover .yt,.cv.playing .yt{opacity:1}
.yt{font-size:13px;color:#ffd3d3}
.info{border:1.5px solid var(--line);border-radius:8px;background:rgba(14,14,14,.92);padding:9px 8px 8px;text-align:center;min-height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.info .t{font-size:21px;color:#f8d48a;line-height:1.02;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .a{font-size:16px;color:#eee;line-height:1.05;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.save{margin-top:5px;background:var(--gold);color:#1a1205;font-size:19px;padding:3px 30px;border-radius:3px;transition:.12s}
.save:hover{background:#ffd75a;transform:scale(1.05)}
.save[disabled]{opacity:.35;pointer-events:none}
/* results */
.res .cv img{filter:brightness(.42)}
.res .cv.picked{background:var(--gold)}
.res .cv.picked img{filter:brightness(.5)}
.pct{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(34px,4.2vw,54px);color:var(--gold);text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.8);pointer-events:none;text-align:center;line-height:.9}
.pct small{display:block;font-size:16px;color:#eee;margin-top:4px}
.res .save{display:none}
.res .info{min-height:78px}
/* bottom bar */
.prev{position:fixed;left:14px;bottom:30px;border:1.5px solid #444;border-radius:999px;padding:10px 18px;font-size:18px;color:#b98f2a;background:rgba(12,12,12,.85);display:flex;gap:10px;align-items:center;z-index:6}
.prev:hover{color:var(--gold);border-color:#777}
.prev[disabled]{opacity:.35;pointer-events:none}
.credit{position:fixed;left:14px;bottom:10px;font-size:11px;color:#aaa;z-index:6}
.mute{position:fixed;right:20px;bottom:22px;display:flex;gap:10px;z-index:6}
.mute button{border:1.5px solid #555;border-radius:999px;height:46px;padding:0 14px;font-size:18px;background:rgba(12,12,12,.85)}
.mute .ic{width:46px;padding:0;display:grid;place-items:center}
.mute svg{width:20px;height:20px;stroke:#eee;fill:none;stroke-width:2}
/* modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:20px}
.mbox{width:min(840px,96vw);min-height:440px;border:2px solid var(--gold2);border-radius:12px;background:rgba(18,18,18,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;text-align:center;gap:18px}
.mbox h2{font-size:56px}
.mbox p{font-size:24px;line-height:1.6}
.mbox p b{color:var(--gold);font-weight:400}
/* lists */
.page{padding:90px 24px 80px;max-width:1150px;margin:0 auto;text-align:center}
.page h1{font-size:clamp(48px,7vw,72px)}
.page .lead{font-size:16px;color:#ddd;margin:14px 0 30px}
.decades{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;text-align:center}
.dcard{border:1.5px solid #6b5418;border-radius:8px;background:rgba(18,16,12,.92);padding:16px 14px}
.dcard h3{font-size:30px;color:var(--gold);font-weight:400;margin-bottom:14px}
.dcard img{width:72%;aspect-ratio:1;object-fit:cover;display:block;margin:0 auto 14px}
.dcard .t{font-size:16px}
.dcard .m{font-size:13px;color:#ccc;margin-top:8px}
.ygrid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-bottom:22px}
@media(max-width:700px){.ygrid{grid-template-columns:repeat(5,1fr)}}
.ygrid button{border:1.5px solid var(--line);border-radius:6px;padding:10px 0;font-size:22px;color:var(--gold);background:rgba(12,12,12,.85)}
.ygrid button.done{background:var(--gold);color:#111}
.ygrid button:hover{box-shadow:0 0 14px rgba(255,194,26,.35)}
.dlabel{text-align:left;font-size:26px;color:#ddd;margin:8px 0 8px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;text-align:center}
.pk .cv{padding:6px}
.pk .y{font-size:20px;color:var(--gold);margin-top:8px}
.pk .t{font-size:18px;line-height:1.05}
.pk .a{font-size:14px;color:#ccc}
.corner{position:fixed;right:20px;bottom:22px;display:flex;gap:10px;z-index:6}
.cbtn{border:1.5px solid var(--gold2);border-radius:6px;padding:10px 16px;font-size:18px;color:var(--gold);background:rgba(12,12,12,.9)}
.cbtn:hover{background:#1e1708}
/* deathmatch */
.dm{display:flex;gap:40px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:24px}
.dm .card{width:min(320px,80vw)}
.vs{font-family:'Limelight';font-size:54px;color:var(--gold);align-self:center}
.dmwrap .mbtns{margin:24px auto 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#111;padding:10px 18px;border-radius:6px;font-size:20px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.hint{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);font-size:15px;color:#bbb;z-index:5;text-align:center}
.dock{position:fixed;right:20px;bottom:80px;transform:translateX(130%);z-index:15;border:2px solid var(--gold);border-radius:10px;background:#0d0d0d;overflow:hidden;transition:transform .3s;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.dock.on{transform:none}
body.docked .stage,body.docked .page{padding-bottom:330px}
.dockbar{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:15px;color:var(--gold);max-width:356px}
.dockbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dockbar button{font-size:15px;color:#ddd}
#ytp{display:block;width:356px;height:200px}
.modal.keym{display:none}.modal.keym.on{display:grid}
#keyin{width:min(520px,80vw);background:#0b0b0b;border:1.5px solid var(--line);border-radius:6px;color:#fff;font:18px ui-monospace,monospace;padding:12px;letter-spacing:0}
.toast{max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="bg"><div class="vinyl v1"></div><div class="vinyl v2"></div></div>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="dock" id="dock"><div class="dockbar"><span id="dockt"></span><button id="dockx" aria-label="Stop">✕</button></div><div id="ytp"></div></div>
<div class="modal keym" id="keymodal"><div class="mbox" style="min-height:0;gap:14px">
  <h2 class="gold-title" style="font-size:44px">YOUTUBE KEY</h2>
  <p style="font-size:18px;line-height:1.5">OPTIONAL: PASTE A FREE YOUTUBE DATA API KEY TO PLAY FULL SONGS ON THE PAGE. WITHOUT ONE, FULL SONG OPENS YOUTUBE IN A NEW TAB.<br>IT'S SAVED ONLY IN THIS BROWSER. FOUND VIDEOS ARE REMEMBERED, SO EACH SONG IS ONLY SEARCHED ONCE.</p>
  <input id="keyin" placeholder="AIza..." autocomplete="off" spellcheck="false">
  <div style="display:flex;gap:10px"><button class="mbtn primary" id="keysave" style="font-size:22px;padding:8px 30px">SAVE</button><button class="mbtn" id="keyclose" style="font-size:22px;padding:8px 30px">CLOSE</button></div>
</div></div>

function isPaused(){if(!playing)return true;if(mode==='clip'){const a=AUD[playing];return !a||a.paused}return ytPaused}
function togglePause(){if(!playing)return;
  if(mode==='clip'){const a=AUD[playing];if(!a)return;if(a.paused)a.play().catch(()=>{});else a.pause();setTimeout(markPlaying,30)}
  else if(ytReady){if(ytPaused)ytp.playVideo();else ytp.pauseVideo()}}
function applyMute(){Object.values(AUD).forEach(a=>a.muted=muted);if(ytReady)muted?ytp.mute():ytp.unMute()}
function setLoading(id,on){const el=document.querySelector(`[data-cv="${id}"] .pp`);if(el){el.classList.toggle('ld',on);if(!on)markPlaying()}}
function markPlaying(){const p=isPaused();document.querySelectorAll('[data-cv]').forEach(el=>{const on=el.dataset.cv===playing;el.classList.toggle('playing',on);const pp=el.querySelector('.pp');if(pp&&!pp.classList.contains('ld'))pp.innerHTML=on&&!p?ICON.pause:ICON.play})}

/* YouTube (full songs) */
let ytp=null,ytReady=false,ytWant=null,ytPaused=true,quotaOut=false,kick=null;
window.onYouTubeIframeAPIReady=()=>{ytp=new YT.Player('ytp',{width:356,height:200,playerVars:{playsinline:1,rel:0,modestbranding:1},
  events:{onReady:()=>{ytReady=true;applyMute();if(ytWant){const w=ytWant;ytWant=null;startVid(w.id,w.from)}},onStateChange:onYT,onError:onYTErr}})};
(()=>{const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc)})();
function onYT(e){
  if(mode!=='yt')return;
  if(e.data===1){ytPaused=false;clearTimeout(kick);if(playing)setLoading(playing,false);markPlaying()}
  else if(e.data===2){ytPaused=true;markPlaying()}
  else if(e.data===0){ytPaused=true;playing=null;markPlaying()}
}
function onYTErr(){
  const id=playing;if(!id||mode!=='yt')return;const s=SONGS[id],list=VID[id]||[];s._try=(s._try||0)+1;
  if(list[s._try]){startVid(id,s._from);return}
  VID[id]=[];store.set('vids',VID);setLoading(id,false);playing=null;markPlaying();toast("NO EMBEDDABLE VIDEO — OPENING YOUTUBE SEARCH INSTEAD");window.open(YTSEARCH(s),'_blank');
}
function startVid(id,from){
  if(!ytReady){ytWant={id,from};return}
  const s=SONGS[id],v=(VID[id]||[])[s._try||0];if(!v)return;s._from=from;
  ytp.loadVideoById(from?{videoId:v,startSeconds:from}:{videoId:v});applyMute();
  $('#dockt').textContent=s.t+' — '+s.a+' · '+s.y;$('#dock').classList.add('on');document.body.classList.add('docked');
  setLoading(id,true);clearTimeout(kick);
  kick=setTimeout(()=>{if(playing===id&&mode==='yt'&&[-1,5].includes(ytp.getPlayerState()))ytp.playVideo()},2500);
}
function arts(a){const main=a.split(/ feat\. | & |, /)[0];const rom=(main.match(/\[(.+?)\]/)||[])[1];return [main.replace(/\s*\[.*?\]/,'').trim(),rom].filter(Boolean)}
const queue=[];let qBusy=false;
function lookup(s){
  if(VID[s.id]!==undefined)return Promise.resolve(VID[s.id]);
  if(!YTKEY||quotaOut)return Promise.resolve(null);
  if(s._p)return s._p;
  s._p=new Promise(res=>{queue.unshift({s,res});pump()});return s._p;
}
async function pump(){
  if(qBusy)return;qBusy=true;
  while(queue.length){
    const {s,res}=queue.shift();let out=null;
    try{
      const [art]=arts(s.a);const core=s.t.split(' / ')[0].replace(/☮︎?/g,"O'").replace(/"/g,'').trim();
      const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=id&type=video&maxResults=5&videoEmbeddable=true&videoSyndicated=true&q='+encodeURIComponent(art+' '+core)+'&key='+encodeURIComponent(YTKEY));
      const j=await r.json();
      if(j.error){const why=(j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||'';
        if(/quota/i.test(why)){quotaOut=true;toast("TODAY'S YOUTUBE SEARCH LIMIT IS USED UP — RESETS AROUND 8AM UK",6000)}
        else{toast('YOUTUBE KEY PROBLEM: '+(j.error.message||why).toUpperCase().slice(0,90),6000)}
      }else{out=(j.items||[]).map(x=>x.id&&x.id.videoId).filter(Boolean);VID[s.id]=out;store.set('vids',VID)}
    }catch(e){toast('COULD NOT REACH YOUTUBE')}
    s._p=null;res(out);
    await sleep(150);
  }
  qBusy=false;
}
// full song on YouTube (from the start); without a key, open YouTube search
async function ytPlay(id,full){
  const s=SONGS[id];
  if(!YTKEY){if(full){window.open(YTSEARCH(s),'_blank');return}
    playing=null;markPlaying();toast('NO CLIP FOR THIS ONE — ADD A YOUTUBE KEY OR USE FULL SONG');
    if(view==='game'&&phase==='reveal'&&!fast){clearTimeout(revealTimer);revealTimer=setTimeout(advance,1200)}return}
  stopAudio(false);playing=id;mode='yt';s._try=0;markPlaying();setLoading(id,true);
  const r=await lookup(s);
  if(playing!==id){return}
  if(!r||!r.length){setLoading(id,false);playing=null;markPlaying();if(r)toast('NO VIDEO FOUND — OPENING YOUTUBE SEARCH');if(r)window.open(YTSEARCH(s),'_blank');return}
  startVid(id,full?0:30);
}
const ICON={play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',spk:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',spkoff:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'};
function openKey(){const m=$('#keymodal');m.classList.add('on');$('#keyin').value=YTKEY;setTimeout(()=>$('#keyin').focus(),50)}
/* ---------- rendering ---------- */
function coverEl(s,extra=''){return `<div class="cv" data-cv="${s.id}">${s?`<img loading="lazy" referrerpolicy="no-referrer" src="${COVER(s)}" alt="" onerror="this.onerror=null;fallbackArt(this,'${s.id}')">`:''}<button class="yt" data-full="${s.id}" title="Play the full song on YouTube">FULL SONG</button><button class="pp" data-play="${s.id}" aria-label="Play preview">${playing===s.id&&!isPaused()?ICON.pause:ICON.play}</button>${extra}</div>`}
window.fallbackArt=(img)=>{img.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'♪'}))};
function render(){
  clearTimeout(revealTimer);
  const app=$('#app');
  if(view==='menu')app.innerHTML=menuHTML();
  else if(view==='game')app.innerHTML=gameHTML();
  else if(view==='years')app.innerHTML=yearsHTML();
  else if(view==='rank')app.innerHTML=rankHTML();
  else if(view==='picks')app.innerHTML=picksHTML();
  else if(view==='dm')app.innerHTML=dmHTML();
  else if(view==='dmrank')app.innerHTML=dmRankHTML();
  bind();
}
function menuHTML(){
  const n=Object.keys(picks).length, cont=n>0&&n<YEARS.length;
  return `<div class="menu">
    <div class="pills"><span class="on">SONGS</span></div>
    <div class="src"><span class="on">AOTY USERS' TOP SONGS</span></div>
    <h1 class="gold-title">MUSIC</h1>
    <div class="mbtns">
      ${cont?`<button class="mbtn primary" data-go="continue">CONTINUE</button>`:''}
      <button class="mbtn ${cont?'':'primary'}" data-go="new">NEW</button>
      <button class="mbtn" data-go="dm">DEATHMATCH</button>
      <button class="mbtn" data-go="years">SKIP TO YEAR</button>
      <button class="mbtn" data-go="rank">RANKINGS</button>
      <button class="mbtn" data-go="picks">YOUR PICKS<small>${n} / ${YEARS.length} SAVED</small></button>
      <button class="mbtn" data-key style="font-size:20px">YOUTUBE KEY<small>${YTKEY?'SET · FULL SONGS PLAY HERE':'OPTIONAL · FOR FULL SONGS'}</small></button>
    </div><div style="margin-top:22px;font-size:13px;color:#888">VERSION 1.4 · 19 NOV</div></div>`;
}
function chrome(){return `<button class="close" data-go="menu" aria-label="Close">✕</button>`}
function gameHTML(){
  const y=YEARS[yi], res=phase==='results';
  const pickedId=picks[y]!=null?y+'-'+picks[y]:null;
  const tot=RAW[y].reduce((a,s)=>a+s[5],0);
  const cards=RAW[y].map((_,i)=>{const s=SONGS[y+'-'+i];const shown=fast||res||i<revealed;
    const pct=res?`<div class="pct">${(s.n/tot*100).toFixed(1).replace('.0','')}%<small>${s.sc} · ${s.n.toLocaleString()} RATINGS</small></div>`:'';
    return `<div class="card ${shown?'in':''}" data-i="${i}">${coverEl(s,pct).replace('class="cv"',`class="cv ${pickedId===s.id&&res?'picked':''}"`)}
      <div class="info"><div class="t" title="${esc(s.t)}">${esc(s.t)}</div><div class="a" title="${esc(s.a)}">${esc(s.a)}</div><button class="save" data-save="${i}">SAVE</button></div></div>`}).join('');
  return `<div class="fast ${fast?'on':''}" data-fast><div class="tog"></div>FAST MODE</div>
    ${chrome()}
    <div class="top"><div>${res?`<div class="year gold-title" style="font-family:'Bebas Neue';font-size:46px">AOTY RATING SHARE</div><div class="sub">CLICK TO CONTINUE</div>`:`<div class="year gold-title">${y}</div>`}</div></div>
    <div class="stage ${res?'res':''}" id="stage"><div class="grid">${cards}</div></div>
    <div class="credit">SONGS FROM ALBUMOFTHEYEAR.ORG · 500+ RATINGS · CLIPS VIA DEEZER · FULL SONGS VIA YOUTUBE</div><button class="prev" data-prev ${yi===0?'disabled':''}>← PREVIOUS YEAR</button>
    <div class="mute"><button data-mute>${muted?'UNMUTE':'MUTE'} MUSIC</button><button class="ic" data-mute>${muted?ICON.spkoff:ICON.spk}</button></div>
    ${!seenTip?`<div class="modal" data-tip><div class="mbox"><h2 class="gold-title">DID YOU KNOW?</h2><p>CLICK TO SKIP A PREVIEW. HOLD LEFT CLICK TO SKIP SILENTLY.<br>ONCE ALL CARDS APPEAR, CLICK A COVER TO PLAY OR PAUSE.<br>CHOOSE <b>SAVE</b> TO KEEP THAT SONG. SPACE PAUSES.</p></div></div>`:''}`;
}
function yearsHTML(){
  const decs={};YEARS.forEach(y=>{(decs[Math.floor(y/10)*10]=decs[Math.floor(y/10)*10]||[]).push(y)});
  return `${chrome()}<div class="page"><h1 class="gold-title">SKIP TO YEAR</h1><p class="lead">GOLD YEARS ALREADY HAVE A SAVED SONG</p>
    ${Object.keys(decs).map(d=>`<div class="dlabel">${d}S</div><div class="ygrid">${decs[d].map(y=>`<button class="${picks[y]!=null?'done':''}" data-year="${y}">${y}</button>`).join('')}</div>`).join('')}</div>`;
}
function rankHTML(){
  const decs={};YEARS.forEach(y=>RAW[y].forEach((_,i)=>{const s=SONGS[y+'-'+i];const d=Math.floor(y/10)*10;if(!decs[d]||s.n>decs[d].n)decs[d]=s}));
  return `${chrome()}<div class="page"><h1 class="gold-title">GLOBAL RANKINGS</h1><p class="lead">DECADE LEADERS BY TOTAL AOTY RATINGS, FROM THIS LINEUP.</p>
    <div class="decades">${Object.keys(decs).map(d=>{const s=decs[d];return `<div class="dcard"><h3>${d}S</h3><img referrerpolicy="no-referrer" src="${COVER(s)}" alt=""><div class="t">${esc(s.t)} - ${esc(s.a)}</div><div class="m">${s.y} · ${s.n.toLocaleString()} RATINGS · ${s.sc}</div></div>`}).join('')}</div></div>`;
}
function picksHTML(){
  const ys=YEARS.filter(y=>picks[y]!=null);
  return `${chrome()}<div class="page"><h1 class="gold-title">YOUR PICKS</h1><p class="lead">${ys.length} OF ${YEARS.length} YEARS SAVED${ys.length?' · CLICK A COVER TO PLAY':''}</p>
    ${ys.length?`<div class="picks">${ys.map(y=>{const s=SONGS[y+'-'+picks[y]];return `<div class="pk">${coverEl(s)}<div class="y">${y}</div><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)}</div></div>`}).join('')}</div>`:`<div class="mbtns" style="margin:0 auto"><button class="mbtn primary" data-go="new">START SAVING</button></div>`}</div>
    <div class="corner">${ys.length?`<button class="cbtn" data-copy>COPY LIST</button><button class="cbtn" data-clear>CLEAR ALL</button>`:''}</div>`;
}
/* ---------- deathmatch ---------- */
let dm=null;
function dmStart(){const pool=YEARS.filter(y=>picks[y]!=null).map(y=>y+'-'+picks[y]);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}dm={round:pool,next:[],idx:0,rn:1};dmFixBye()}
function dmFixBye(){if(dm.idx>=dm.round.length-1){if(dm.idx===dm.round.length-1)dm.next.push(dm.round[dm.idx]);dm.round=dm.next;dm.next=[];dm.idx=0;dm.rn++;}}
function dmHTML(){
  const n=YEARS.filter(y=>picks[y]!=null).length;
  if(!dm||dm.done||dm.round.length<2){
    if(dm&&dm.round.length===1){const champ=dm.round[0];const h=store.get('champs',[]);h.push(champ);store.set('champs',h);dm={done:champ}}
    if(dm&&dm.done){const s=SONGS[dm.done];return `${chrome()}<div class="page dmwrap"><h1 class="gold-title">LAST ONE STANDING</h1><p class="lead">YOUR CHAMPION</p><div class="dm"><div class="card in">${coverEl(s)}<div class="info"><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)} · ${s.y}</div></div></div></div><div class="mbtns"><button class="mbtn primary" data-dmstart>RUN IT BACK</button><button class="mbtn" data-go="dmrank">DEATHMATCH RANKINGS</button></div></div>`}
    return `${chrome()}<div class="page dmwrap" style="padding-top:140px"><h1 class="gold-title">LAST ONE<br>STANDING</h1><p class="lead" style="max-width:560px;margin:22px auto">YOUR TOP PICK FROM EACH YEAR GETS SHUFFLED INTO HEAD-TO-HEAD ROUNDS. KEEP CHOOSING UNTIL ONLY ONE IS LEFT STANDING.</p><p class="lead">${n} YEARLY PICKS SAVED</p>
      <div class="mbtns"><button class="mbtn primary" data-dmstart ${n<2?'disabled style="opacity:.4"':''}>START DEATHMATCH</button><button class="mbtn" data-go="dmrank">DEATHMATCH RANKINGS</button></div></div>
      <div class="corner">${store.get('champs',[]).length?`<button class="cbtn" data-dmclear>CLEAR ALL</button>`:''}</div>`;
  }
  const a=SONGS[dm.round[dm.idx]],b=SONGS[dm.round[dm.idx+1]];
  const left=dm.round.length-dm.idx+dm.next.length;
  const side=(s,k)=>`<div class="card in">${coverEl(s)}<div class="info"><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)} · ${s.y}</div><button class="save" data-dmpick="${k}">KEEP</button></div></div>`;
  return `${chrome()}<div class="page"><h1 class="gold-title" style="font-size:48px">ROUND ${dm.rn}</h1><p class="lead">${left} SONGS LEFT STANDING</p><div class="dm">${side(a,0)}<div class="vs">VS</div>${side(b,1)}</div></div>`;
}
function dmRankHTML(){
  const h=store.get('champs',[]);const c={};h.forEach(id=>c[id]=(c[id]||0)+1);const list=Object.keys(c).filter(id=>SONGS[id]).sort((x,y)=>c[y]-c[x]);
  return `${chrome()}<div class="page"><h1 class="gold-title">DEATHMATCH RANKINGS</h1><p class="lead">YOUR CHAMPIONS BY WINS</p>
   ${list.length?`<div class="picks">${list.map(id=>{const s=SONGS[id];return `<div class="pk">${coverEl(s)}<div class="y">${c[id]} WIN${c[id]>1?'S':''}</div><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)} · ${s.y}</div></div>`}).join('')}</div>`:'<p class="lead">NO CHAMPIONS YET</p>'}</div>`;
}

/* ---------- game flow ---------- */
function enterYear(i){
  yi=Math.max(0,Math.min(YEARS.length-1,i));revealed=0;phase='reveal';stopAudio();view='game';store.set('yi',yi);
  render();preloadYear(YEARS[yi]);setTimeout(()=>preloadYear(YEARS[yi+1]),3000);
  if(seenTip&&!fast)setTimeout(advance,350);
}
function advance(){
  if(view!=='game'||phase!=='reveal'||fast)return;
  clearTimeout(revealTimer);
  if(revealed>=10){phase='choose';stopAudio();return}
  revealed++;const card=document.querySelector(`.card[data-i="${revealed-1}"]`);if(card)card.classList.add('in');
  const s=SONGS[YEARS[yi]+'-'+(revealed-1)];
  play(s.id);
  revealTimer=setTimeout(advance,CLIP_MS);
}
function revealAll(silent){clearTimeout(revealTimer);revealed=10;phase='choose';if(silent)stopAudio();document.querySelectorAll('.card').forEach(c=>c.classList.add('in'))}
function save(i){
  const y=YEARS[yi];picks[y]=i;store.set('picks',picks);stopAudio();phase='results';resultsFor=y;render();
}
function afterResults(){
  const next=YEARS.findIndex((y,i)=>i>yi&&picks[y]==null);
  if(yi<YEARS.length-1){enterYear(yi+1)}else{view='picks';render();toast(next<0?'ALL YEARS SAVED — TRY DEATHMATCH':'END OF THE LINE')}
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll('[data-key]').forEach(b=>b.onclick=e=>{e.stopPropagation();openKey()});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.stopPropagation();const g=b.dataset.go;stopAudio();
    if(g==='menu'){view='menu';render()}
    else if(g==='new'){if(Object.keys(picks).length&&!b.dataset.armed){b.dataset.armed=1;b.innerHTML='NEW<small>CLICK AGAIN — THIS CLEARS YOUR PICKS</small>';return}picks={};store.set('picks',picks);enterYear(0)}
    else if(g==='continue'){const f=YEARS.findIndex(y=>picks[y]==null);enterYear(f<0?0:f)}
    else{view=g;if(g==='dm')dm=null;render()}});
  document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>enterYear(YEARS.indexOf(+b.dataset.year)));
  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.play;if(view==='game'&&phase==='reveal'){revealAll(false)}
    if(playing===id){togglePause()}else play(id)});
  document.querySelectorAll('[data-full]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.full;if(view==='game'&&phase==='reveal')revealAll(true);ytPlay(id,true)});
  document.querySelectorAll('.cv').forEach(c=>c.addEventListener('click',e=>{if(e.target.closest('[data-full],[data-play]'))return;const b=c.querySelector('[data-play]');if(b&&!(view==='game'&&phase==='results'))b.click()}));
  
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();save(+b.dataset.save)});
  const f=document.querySelector('[data-fast]');if(f)f.onclick=e=>{e.stopPropagation();fast=!fast;store.set('fast',fast);if(fast){revealAll(true)}f.classList.toggle('on',fast);if(!fast&&phase==='reveal'){revealed=0;render();advance()}};
  const p=document.querySelector('[data-prev]');if(p)p.onclick=e=>{e.stopPropagation();enterYear(yi-1)};
  document.querySelectorAll('[data-mute]').forEach(b=>b.onclick=e=>{e.stopPropagation();muted=!muted;store.set('muted',muted);applyMute();const m=document.querySelectorAll('.mute button');m[0].textContent=(muted?'UNMUTE':'MUTE')+' MUSIC';m[1].innerHTML=muted?ICON.spkoff:ICON.spk});
  const tip=document.querySelector('[data-tip]');if(tip)tip.onclick=e=>{e.stopPropagation();seenTip=true;store.set('tip',true);tip.remove();if(!fast)advance()};
  const cp=document.querySelector('[data-copy]');if(cp)cp.onclick=async()=>{const lines=['SAVE ONE SONG — MY PICKS'];YEARS.forEach(y=>{if(picks[y]!=null){const s=SONGS[y+'-'+picks[y]];lines.push(`${y}  ${s.t} — ${s.a}`)}});try{await navigator.clipboard.writeText(lines.join('\n'));toast('COPIED')}catch(e){toast('COPY BLOCKED BY BROWSER')}};
  const cl=document.querySelector('[data-clear]');if(cl)cl.onclick=()=>{if(cl.dataset.armed){picks={};store.set('picks',picks);render();toast('PICKS CLEARED')}else{cl.dataset.armed=1;cl.textContent='CLICK AGAIN TO CLEAR';setTimeout(()=>{if(cl.isConnected){delete cl.dataset.armed;cl.textContent='CLEAR ALL'}},2500)}};
  const dmc=document.querySelector('[data-dmclear]');if(dmc)dmc.onclick=()=>{store.set('champs',[]);render();toast('DEATHMATCH HISTORY CLEARED')};
  document.querySelectorAll('[data-dmstart]').forEach(b=>b.onclick=()=>{if(YEARS.filter(y=>picks[y]!=null).length<2)return;dmStart();render()});
  document.querySelectorAll('[data-dmpick]').forEach(b=>b.onclick=e=>{e.stopPropagation();stopAudio();dm.next.push(dm.round[dm.idx+ +b.dataset.dmpick]);dm.idx+=2;dmFixBye();render()});
}
// stage clicks: skip preview (click) / skip silently (hold); continue after results
let holdT=null,held=false;
document.addEventListener('pointerdown',e=>{if(view!=='game'||phase!=='reveal'||e.target.closest('button,a,.cv,[data-fast],.modal,.dock'))return;held=false;holdT=setTimeout(()=>{held=true;revealAll(true)},450)});
document.addEventListener('pointerup',e=>{clearTimeout(holdT);if(view!=='game'||e.target.closest('button,a,[data-fast],.modal,.dock'))return;
  if(phase==='results'){afterResults();return}
  if(phase==='reveal'&&!held&&!e.target.closest('.cv')){stopAudio(false);advance()}});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();togglePause()}
  if(view==='game'&&phase==='results'&&(e.key==='Enter'||e.key==='ArrowRight'))afterResults();
  if(e.key==='Escape'&&!$('#keymodal').classList.contains('on')){stopAudio();view='menu';render()}
});
$('#keysave').onclick=()=>{YTKEY=$('#keyin').value.trim();store.set('ytkey',YTKEY);quotaOut=false;$('#keymodal').classList.remove('on');toast(YTKEY?'KEY SAVED':'KEY CLEARED');if(view==='menu')render()};
$('#keyclose').onclick=()=>$('#keymodal').classList.remove('on');
$('#keyin').onkeydown=e=>{if(e.key==='Enter')$('#keysave').click()};
$('#dockx').onclick=()=>{stopAudio();$('#dock').classList.remove('on');document.body.classList.remove('docked')};
yi=Math.min(store.get('yi',0),YEARS.length-1);
render();
</script>
