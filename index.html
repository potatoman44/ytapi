<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save One Song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* Save One Song: record-shop wall. Cobalt back wall, white type, round price stickers for scores. */
:root{--blue:#2b3ec2;--blue2:#2233a3;--blue3:#1a287f;--white:#fff;--soft:rgba(255,255,255,.72);--faint:rgba(255,255,255,.38);--sun:#ffe24a;--rose:#ff9fcd;--ink:#000;
 --paper:#fff;--paperink:#000;--hot:var(--sun);--cool:var(--white);--deep:var(--blue2);--plum:var(--blue3);--gold:var(--sun);--gold2:var(--sun);--line:var(--white)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--blue);color:var(--white);font-family:'Archivo',system-ui,sans-serif;font-weight:500;font-stretch:100%;font-size:16px;line-height:1.4;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.app{position:relative;z-index:1;min-height:100vh}
/* headlines: wide, heavy, tight */
.gold-title{font-weight:850;font-stretch:125%;letter-spacing:-.025em;line-height:.92;color:var(--white)}
/* MENU */
.menu{display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px}
.pills{display:inline-flex;gap:2px;border:1.5px solid var(--white);border-radius:999px;padding:3px}
.pills span{padding:6px 16px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.pills span.on{background:var(--white);color:var(--blue)}
.pills.decs{margin-top:10px;border-color:var(--faint)}
.pills.decs span{padding:4px 12px;font-size:14px}
.menu h1{font-size:clamp(52px,8.5vw,104px);margin:52px 0 16px;text-align:center;max-width:9.5ch}
.tag{font-size:17px;color:var(--soft);text-align:center;max-width:42ch;margin:0 auto 36px}
.ver{margin-top:26px;font-size:13px;color:var(--faint)}
.mbtns{display:flex;flex-direction:column;gap:8px;width:min(400px,92vw)}
.mbtn{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border:1.5px solid var(--white);border-radius:8px;padding:12px 16px;font-size:20px;font-weight:650;text-align:left;transition:background .12s,color .12s}
.mbtn:hover{background:var(--blue2)}
.mbtn.primary{background:var(--white);color:var(--blue);justify-content:center}
.mbtn.primary:hover{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.mbtn small{font-size:14px;font-weight:500;opacity:.7}
/* GAME */
.top{position:fixed;top:0;left:0;right:0;height:96px;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:var(--blue)}
.top>*{pointer-events:auto}
.fast{position:fixed;left:18px;top:22px;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;z-index:6;cursor:pointer}
.tog{width:38px;height:22px;border-radius:999px;border:1.5px solid var(--white);position:relative;transition:.2s}
.tog::after{content:"";position:absolute;left:3px;top:2.5px;width:14px;height:14px;border-radius:50%;background:var(--white);transition:.2s}
.fast.on .tog{background:var(--white)}.fast.on .tog::after{left:18px;background:var(--blue)}
.close{position:fixed;right:18px;top:18px;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--white);display:grid;place-items:center;font-size:17px;z-index:6}
.close:hover{background:var(--white);color:var(--blue)}
.year{font-size:64px}
.year.rs{font-size:44px}
.year.mon{font-size:50px}
.year.cat{font-size:40px;max-width:76vw;line-height:1;text-align:center}.year.cat.long{font-size:28px}
.sub{font-size:14px;color:var(--soft);text-align:center;margin-top:6px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))!important}
.cgrid button{padding:10px 10px;line-height:1.2;text-align:left;font-size:16px}
.cgrid button small{display:block;font-size:12px;opacity:.7;margin-top:2px}
.mgrid{grid-template-columns:repeat(12,1fr)!important}
.stage{padding:110px 24px 120px;max-width:1300px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px 26px}
.card,.info,.cv{min-width:0}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px}}
@media(max-width:600px){
 .top{height:116px;padding-top:50px}.year{font-size:40px}.year.rs{font-size:30px}.year.mon{font-size:30px}.year.cat{font-size:24px}.year.cat.long{font-size:18px}
 .cgrid{grid-template-columns:repeat(2,1fr)!important}.mgrid{grid-template-columns:repeat(6,1fr)!important}
 .fast{top:14px;left:12px;font-size:14px}
 .close{top:10px;right:10px;width:38px;height:38px}
 .stage{padding:126px 14px 140px}.page{padding:80px 16px 100px}
 .info .t{font-size:15px}.info .a{font-size:13px}
 .pp{width:36px;height:36px;right:7px;bottom:7px}.pp svg{width:15px;height:15px}
 .yt{left:7px;bottom:9px;font-size:11px}
 .credit{display:none}
 .prev{bottom:12px;left:10px;font-size:14px;padding:8px 12px}.prev .long{display:none}
 .mute button:not(.ic){display:none}
 .mute{right:10px;bottom:10px}.mute .ic{width:38px;height:38px}
 .dock{right:8px;bottom:62px}#ytp{width:300px;height:200px}.dockbar{max-width:300px}
 .menu h1{margin:36px 0 12px}
 .pct{width:54px;height:54px;font-size:21px;top:-8px;right:-6px}
}
.card{display:flex;flex-direction:column;gap:10px;opacity:0;transition:opacity .3s}
.card.in{opacity:1}
.stage .card:not(.in){pointer-events:none}
/* sleeve */
.cv{position:relative;aspect-ratio:1;cursor:pointer}
.cv img,.cv .ph{width:100%;height:100%;object-fit:cover;display:block;background:var(--blue3);outline:0 solid var(--sun);transition:outline-width .12s}
.cv .ph{display:grid;place-items:center;color:var(--faint);font-size:40px}
.cv.playing img,.cv.playing .ph{outline-width:4px}
.pp{position:absolute;z-index:2;right:9px;bottom:9px;width:40px;height:40px;border-radius:50%;background:var(--white);display:grid;place-items:center}
.pp svg{width:16px;height:16px;fill:var(--blue);stroke:var(--blue);stroke-width:2.4;stroke-linejoin:round}
.cv.playing .pp{background:var(--sun)}.cv.playing .pp svg{fill:var(--ink);stroke:var(--ink)}
.pp.na{opacity:.35}
.pp.ld svg{display:none}.pp.ld::after{content:"";width:15px;height:15px;border-radius:50%;border:2.5px solid rgba(43,62,194,.25);border-top-color:var(--blue);animation:spin .8s linear infinite}
.yt{position:absolute;z-index:2;left:9px;bottom:11px;padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--white);font-size:12px;font-weight:600;opacity:0;transition:opacity .15s}
.cv:hover .yt,.cv.playing .yt,.cv:focus-within .yt{opacity:1}
/* title + artist under the sleeve */
.info{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.info .t{font-size:16px;font-weight:650;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .a{font-size:14px;color:var(--soft);line-height:1.25;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.info .n{font-size:13px;color:var(--soft)}
.save{margin-top:8px;border:1.5px solid var(--white);border-radius:999px;padding:4px 18px;font-size:14px;font-weight:650}
.save:hover{background:var(--white);color:var(--blue)}
.save[disabled]{opacity:.35;pointer-events:none}
/* results: price-sticker scores */
.res .cv img{filter:grayscale(1) brightness(.62) contrast(1.05)}
.res .cv.picked img{filter:none;outline:4px solid var(--white)}
.pct{position:absolute;z-index:3;top:-10px;right:-8px;width:66px;height:66px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;font-size:26px;font-weight:850;font-stretch:115%;letter-spacing:-.03em;transform:rotate(-9deg);pointer-events:none;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.res .cv.picked .pct{background:var(--rose)}
.res .save{display:none}
/* bottom bar */
.prev{position:fixed;left:16px;bottom:30px;border:1.5px solid var(--white);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;white-space:nowrap;z-index:6;background:var(--blue)}
.prev:hover{background:var(--white);color:var(--blue)}
.prev[disabled]{opacity:.3;pointer-events:none}
.credit{position:fixed;left:16px;bottom:8px;font-size:12px;color:var(--faint);z-index:6}
.mute{position:fixed;right:18px;bottom:24px;display:flex;gap:8px;z-index:6}
.mute button{border:1.5px solid var(--white);border-radius:999px;height:40px;padding:0 16px;font-size:15px;font-weight:600;background:var(--blue)}
.mute .ic{width:40px;padding:0;display:grid;place-items:center}
.mute svg{width:18px;height:18px;stroke:var(--white);fill:none;stroke-width:2}
/* modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(14,20,70,.62);padding:20px}
.mbox{width:min(640px,92vw);border-radius:14px;background:var(--blue2);display:flex;flex-direction:column;align-items:center;padding:36px 30px;text-align:center;gap:18px}
.mbox h2{font-size:44px}
.mbox p{font-size:17px;line-height:1.55;color:var(--soft);max-width:46ch}
.mbox p b{color:var(--white);font-weight:700}
.mbox .mbtn{width:auto}
/* lists */
.page{padding:100px 24px 90px;max-width:1150px;margin:0 auto;text-align:center}
.page h1{font-size:clamp(42px,6.5vw,72px)}
.page .lead{font-size:16px;color:var(--soft);margin:16px auto 30px;max-width:60ch}
.decades{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:30px 22px;text-align:left}
.dcard h3{font-size:30px;font-weight:850;font-stretch:125%;letter-spacing:-.02em;margin-bottom:10px}
.dcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block;margin-bottom:10px}
.dcard .t{font-size:15px;font-weight:650}
.dcard .m{font-size:13px;color:var(--soft);margin-top:4px}
.ygrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:22px}
@media(max-width:700px){.ygrid{grid-template-columns:repeat(5,1fr)}}
.ygrid button{border:1.5px solid var(--faint);border-radius:8px;padding:9px 0;font-size:17px;font-weight:650;transition:background .12s}
.ygrid button.done{background:var(--white);color:var(--blue);border-color:var(--white)}
.ygrid button:hover{border-color:var(--white);background:var(--blue2)}
.ygrid button.done:hover{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.dlabel{text-align:left;font-size:26px;font-weight:850;font-stretch:125%;letter-spacing:-.02em;margin:18px 0 10px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:28px 20px;text-align:left}
.pk .y{font-size:13px;font-weight:700;color:var(--sun);margin-top:10px}
.pk .t{font-size:15px;font-weight:650;line-height:1.2}
.pk .a{font-size:13px;color:var(--soft)}
.corner{position:fixed;right:18px;bottom:22px;display:flex;gap:8px;z-index:6}
.cbtn{border:1.5px solid var(--white);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;background:var(--blue)}
.cbtn:hover{background:var(--white);color:var(--blue)}
.cbtn.hot{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.sharebox{gap:14px;max-height:92vh;overflow:auto}.shprev img{max-width:100%;max-height:46vh;display:block;margin:0 auto}
.shbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.shbtns .mbtn{font-size:16px;padding:8px 16px;width:auto}
.shurl{width:100%;font:inherit;font-size:13px;padding:8px 10px;background:var(--blue3);color:var(--white);border:0;border-radius:8px}
/* deathmatch */
.dm{display:flex;gap:36px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:24px}
.dm .card{width:min(300px,78vw)}
.vs{font-size:40px;font-weight:850;font-stretch:125%;align-self:center;color:var(--soft)}
.dmwrap .mbtns{margin:26px auto 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--sun);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.dock{position:fixed;right:18px;bottom:80px;transform:translateX(130%);z-index:15;border-radius:10px;background:var(--ink);overflow:hidden;transition:transform .3s}
.dock.on{transform:none}
body.docked .stage,body.docked .page{padding-bottom:330px}
.dockbar{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;color:var(--white);max-width:356px}
.dockbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ytp{display:block;width:356px;height:200px}
.modal.keym{display:none}.modal.keym.on{display:grid}
#keyin{width:min(480px,80vw);background:var(--blue3);border:1.5px solid var(--faint);border-radius:8px;color:var(--white);font:15px ui-monospace,monospace;padding:11px}
.skipbar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:8px;z-index:7}
.skipbar button{white-space:nowrap;border:1.5px solid var(--white);border-radius:999px;padding:9px 24px;font-size:16px;font-weight:650;background:var(--white);color:var(--blue)}
.skipbar button+button{background:var(--blue);color:var(--white)}
@media(max-width:600px){.skipbar{bottom:62px}.skipbar button{font-size:15px;padding:8px 18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* ---- black / grey / gold / red theme (default) ---- */
body.th-gold{--blue:#000;--blue2:#161616;--blue3:#262626;--white:#f3f1ec;--soft:#a3a3a3;--faint:#5c5c5c;--sun:#d8aa3c;--rose:#c8202f;--ink:#000;--btn:#d8aa3c;--btnink:#000}
body.th-blue{--btn:var(--white);--btnink:var(--blue)}
body.th-gold .pills{border-color:var(--faint)}
body.th-gold .pills span.on,body.th-gold .ygrid button.done,body.th-gold .skipbar button:first-child{background:var(--sun);color:#000;border-color:var(--sun)}
body.th-gold .mbtn{border-color:#3a3a3a}
body.th-gold .mbtn:hover,body.th-gold .cbtn:hover,body.th-gold .prev:hover,body.th-gold .close:hover,body.th-gold .save:hover{background:var(--white);color:#000;border-color:var(--white)}
body.th-gold .mbtn.primary{background:var(--sun);color:#000;border-color:var(--sun)}
body.th-gold .mbtn.primary:hover{background:var(--white);border-color:var(--white)}
body.th-gold .save,body.th-gold .prev,body.th-gold .cbtn,body.th-gold .close,body.th-gold .mute button,body.th-gold .skipbar button+button{border-color:#4a4a4a}
body.th-gold .pp{background:var(--white)}body.th-gold .pp svg{fill:#000;stroke:#000}
body.th-gold .cv.playing .pp{background:var(--sun)}
body.th-gold .res .cv.picked .pct{background:var(--rose);color:#fff}
body.th-gold .res .cv.picked img{outline-color:var(--rose)}
body.th-gold .pk .y{color:var(--sun)}
body.th-gold .mbox{background:#121212;border:1px solid #2c2c2c}
body.th-gold .modal{background:rgba(0,0,0,.72)}
body.th-gold .gold-title{color:var(--white)}
body.th-gold .menu h1{color:var(--white)}
body.th-gold .cbtn.hot{background:var(--sun);border-color:var(--sun)}
body.th-gold .toast{background:var(--sun)}
/* ---- music bits ---- */
/* a record leaning against the wall on the menu */
.rec{position:fixed;z-index:0;right:-230px;top:50%;width:560px;height:560px;margin-top:-280px;border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,#000 0 1.6%,var(--rose) 1.9% 30%,#0b0b0b 30.4% 31.4%,transparent 31.8%),
  conic-gradient(from 20deg,rgba(255,255,255,.07),rgba(255,255,255,0) 14%,rgba(255,255,255,.05) 48%,rgba(255,255,255,0) 64%,rgba(255,255,255,.07)),
  repeating-radial-gradient(circle,#141414 0 2px,#090909 2px 4px);
 box-shadow:0 0 0 1px #2a2a2a;animation:spin 14s linear infinite}
.rec::after{content:"SIDE A";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(-60px);font-size:13px;font-weight:700;font-stretch:115%;color:#000;letter-spacing:.02em;white-space:nowrap}
body.th-blue .rec{background:radial-gradient(circle,var(--blue) 0 1.6%,var(--sun) 1.9% 30%,#111 30.4% 31.4%,transparent 31.8%),repeating-radial-gradient(circle,#161616 0 2px,#0b0b0b 2px 4px)}
@media(max-width:900px){.rec{width:360px;height:360px;margin-top:-180px;right:-230px;opacity:.6}.rec::after{display:none}}
.menu{position:relative;z-index:1}
.mbtn{background:var(--blue)}.mbtn.primary{background:var(--btn)}
/* level meter on the cover that's playing */
.eq{position:absolute;z-index:2;left:9px;top:9px;display:none;align-items:flex-end;gap:3px;height:22px;padding:4px 5px;border-radius:4px;background:rgba(0,0,0,.7)}
.eq i{display:block;width:4px;height:100%;background:var(--sun);transform-origin:bottom;animation:eqb .9s ease-in-out infinite}
.eq i:nth-child(2){animation-duration:.7s;animation-delay:-.3s}.eq i:nth-child(3){animation-duration:1.1s;animation-delay:-.5s}.eq i:nth-child(4){animation-duration:.8s;animation-delay:-.1s}
@keyframes eqb{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.cv.playing .eq{display:flex}
.cv.playing.paused .eq i{animation-play-state:paused}
/* how far through the preview you are */
.prog{position:absolute;z-index:2;left:0;bottom:0;height:4px;width:0;background:var(--sun);display:none}
.cv.playing .prog{display:block}
/* turntable tonearm-style year marker: a thin groove line under the heading */
.top::after{content:"";width:120px;height:3px;margin-top:8px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--sun) 0 12px,transparent 12px 18px);opacity:.9}
.top:has(.sub)::after{display:none}
@media(prefers-reduced-motion:reduce){.rec,.eq i{animation:none!important}}
.custom{max-width:760px}
.clist{display:flex;flex-direction:column;gap:8px;margin:0 0 34px;text-align:left}
.crow{display:flex;align-items:center;gap:8px;border:1.5px solid var(--faint);border-radius:10px;padding:10px 12px}
.crow>div{flex:1;min-width:0}.crow b{display:block;font-size:17px}.crow small{font-size:13px;color:var(--soft)}
.crow .cbtn{padding:6px 12px;font-size:14px}
.cform{display:flex;flex-direction:column;gap:14px;text-align:left;border-top:1.5px solid var(--faint);padding-top:26px}
.cform h2{font-size:28px;font-weight:850;font-stretch:125%;letter-spacing:-.02em}
.cform .hint{font-weight:500;font-size:13px;color:var(--faint)}
.cform label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--soft)}
.cform input,.cform select,.cform textarea{font:inherit;font-size:16px;color:var(--white);background:var(--blue2);border:1.5px solid var(--faint);border-radius:8px;padding:10px 12px}
.cform textarea{resize:vertical;line-height:1.5}
.crange{display:flex;gap:12px}.crange label{flex:1}
.cfound{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--blue2);font-size:14px}
.chip img{width:24px;height:24px;border-radius:50%;object-fit:cover}.chip small{color:var(--soft)}
.chip.bad{padding:3px 10px;background:var(--rose);color:#fff}
.cact{display:flex;gap:8px;flex-wrap:wrap}.cact .mbtn{width:auto;justify-content:center}
.cbar{height:8px;border-radius:4px;background:var(--blue2);overflow:hidden;max-width:420px;margin:0 auto}.cbar i{display:block;height:100%;background:var(--sun);transition:width .3s}
</style>
</head>
<body class="th-gold">
<div class="rec" id="rec" hidden></div>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="dock" id="dock"><div class="dockbar"><span id="dockt"></span><button id="dockx" aria-label="Stop">✕</button></div><div id="ytp"></div></div>
<div class="modal keym" id="keymodal"><div class="mbox" style="min-height:0;gap:14px">

function catRounds(t,c,multi){

  for(const [yr,albums] of c.rounds){
    let songs;

    const MINR=200,big=x=>x[2]>=MINR;
    if(!multi){if(albums.length<(t==='genre'?5:3))continue;
      const pick=albums.map(([al,ar,img,y,tr],ai)=>{const x=tr.find(big)||tr[0];return [[x[0],ar,al,img,x[1],x[2],x[3]||0,y],ai]});

      songs=hi.slice(0,10);if(songs.length<5)songs=songs.concat(lo.sort((a,b)=>b[0][4]-a[0][4]||b[0][5]-a[0][5]).slice(0,5-songs.length));
      songs=songs.sort((a,b)=>a[1]-b[1]).map(p=>p[0])}
    else{const all=[];albums.forEach(([al,ar,img,y,tr],ai)=>tr.forEach((x,ti)=>all.push([[x[0],ar,al,img,x[1],x[2],x[3]||0,y],ai,ti])));
      const by=(a,b)=>b[0][4]-a[0][4]||b[0][5]-a[0][5];
      const hi=all.filter(p=>p[0][5]>=MINR).sort(by),lo=all.filter(p=>p[0][5]<MINR).sort(by);
      songs=hi.slice(0,10);if(songs.length<5)songs=songs.concat(lo.slice(0,5-songs.length));
      songs=songs.sort((a,b)=>a[1]-b[1]||a[2]-b[2]).map(x=>x[0]);if(songs.length<5)continue}
    out.push([yr,yr,songs])}
  return out;
}

function dmFixBye(){if(dm.idx>=dm.round.length-1){if(dm.idx===dm.round.length-1)dm.next.push(dm.round[dm.idx]);dm.round=dm.next;dm.next=[];dm.idx=0;dm.rn++;}}

/* ---------- game flow ---------- */
function enterYear(i){
  yi=Math.max(0,Math.min(YEARS.length-1,i));revealed=0;phase='reveal';stopAudio();view='game';store.set(gk('yi'),yi);
  render();preloadYear(YEARS[yi]);setTimeout(()=>{if(YEARS[yi+1])RAW[YEARS[yi+1]].forEach((_,i)=>urlFor(YEARS[yi+1]+'-'+i))},4000);

}
function advance(){
  if(view!=='game'||phase!=='reveal'||fast)return;
  clearTimeout(revealTimer);
  if(revealed>=RAW[YEARS[yi]].length){phase='choose';stopAudio();hideSkip();return}
  revealed++;const card=document.querySelector(`.card[data-i="${revealed-1}"]`);if(card)card.classList.add('in');
  const s=SONGS[YEARS[yi]+'-'+(revealed-1)];
  play(s.id);
  revealTimer=setTimeout(advance,CLIP_MS);
}
function hideSkip(){const b=document.querySelector('.skipbar');if(b)b.remove()}
function revealAll(silent){clearTimeout(revealTimer);revealed=RAW[YEARS[yi]].length;phase='choose';hideSkip();if(silent)stopAudio();document.querySelectorAll('.card').forEach(c=>c.classList.add('in'))}
function save(i){
  const y=YEARS[yi];picks[y]=i;store.set(gk('picks'),picks);clearTimeout(revealTimer);hideSkip();phase='results';resultsFor=y;render();
  // keep the chosen song playing (its whole clip) until the player moves on

function afterResults(){

  if(e.key==='Escape'&&!$('#keymodal').classList.contains('on')){stopAudio();view='menu';render()}
});
$('#keysave').onclick=()=>{YTKEY=$('#keyin').value.trim();store.set('ytkey',YTKEY);quotaOut=false;$('#keymodal').classList.remove('on');toast(YTKEY?'Key saved':'Key removed');if(view==='menu')render()};
$('#keyclose').onclick=()=>$('#keymodal').classList.remove('on');
$('#keyin').onkeydown=e=>{if(e.key==='Enter')$('#keysave').click()};
$('#dockx').onclick=()=>{
  // only stop YouTube; leave a Deezer clip that's playing alone
  clearTimeout(kick);if(ytReady)ytp.stopVideo();ytPaused=true;
  if(mode==='yt'&&playing){setLoading(playing,false);playing=null;markPlaying()}
  $('#dock').classList.remove('on');document.body.classList.remove('docked')};
yi=Math.min(store.get('yi',0),YEARS.length-1);
(async()=>{const q=new URLSearchParams(location.search);
  if(q.get('c')){try{const j=JSON.parse(q.get('c'));const cfg={id:q.get('g').slice(9),name:j.n,from:+j.f,to:+j.t,artists:j.a.map(([id,name])=>({id,name})),albums:(j.b||[]).map(([id,title,artist])=>({id,title,artist}))};if(!customs().find(c=>c.id===cfg.id))saveCustoms([...customs(),cfg])}catch(e){}}
  if(q.get('p')!=null&&q.get('g')){const g=q.get('g');if(g==='year'||await setGame(g)){if(g==='year'&&GAME!=='year')await setGame('year');
    SHARED={};(q.get('p')||'').replace(/-([0-9a-z])/g,(m,c)=>'_'.repeat(B36.indexOf(c))).split('').forEach((ch,i)=>{const n=B36.indexOf(ch);if(n>=0&&YEARS[i]!=null)SHARED[YEARS[i]]=n});view='shared';render();
    history.replaceState(null,'',location.pathname);return}}
  const g=store.get('game','year');if(g!=='year'){await setGame(g)}render()})();
</script>
