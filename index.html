<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAVE ONE SONG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Fraunces:ital,opsz,wght@1,9..144,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b12;--ink:#f1e9da;--hot:#ff6b3d;--hot2:#ff8a5c;--cool:#49d6c6;--plum:#2a1838;--deep:#16101e;--paper:#f1e9da;--paperink:#1a1220;
 --gold:var(--hot);--gold2:var(--hot);--line:#f1e9da}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;letter-spacing:.04em;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
/* background: glowing colour fields + halftone dots + scanlines */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#120d1a 0%,#0d0b12 55%,#150c14 100%)}
.bg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(241,233,218,.09) 1px,transparent 1.4px);background-size:7px 7px;mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 70%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 70%,transparent 100%)}
.bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.5}
.vinyl{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.v1{width:520px;height:520px;left:-160px;top:-80px;background:radial-gradient(circle,var(--hot) 0,rgba(255,107,61,0) 70%)}
.v2{width:560px;height:560px;right:-200px;bottom:-160px;top:auto;background:radial-gradient(circle,var(--cool) 0,rgba(73,214,198,0) 70%);animation-duration:28s;opacity:.4}
@keyframes drift{to{transform:translate(60px,40px) scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
.app{position:relative;z-index:1;min-height:100vh}
/* headline style (class name kept from v1) */
.gold-title{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:900;color:var(--ink);letter-spacing:-.01em;line-height:.95;text-shadow:3px 3px 0 var(--hot),6px 6px 0 var(--plum)}
/* MENU */
.menu{display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px}
.pills{display:flex;gap:4px;border:2px solid var(--ink);border-radius:4px;padding:4px;background:var(--deep);box-shadow:4px 4px 0 var(--cool)}
.pills span{padding:6px 18px;border-radius:2px;font-size:19px;color:var(--ink)}
.pills span.on{background:var(--cool);color:var(--paperink)}
.src{margin-top:16px;display:flex;gap:12px}
.src span{border:2px dashed rgba(241,233,218,.5);border-radius:4px;padding:10px 22px;font-size:20px;color:var(--ink);background:transparent;min-width:240px;text-align:center}
.src span.on{background:transparent;color:var(--cool);border-color:var(--cool)}
.menu h1{font-size:clamp(60px,10vw,112px);margin:44px 0 40px;text-align:center}
.menu h1 small{display:block;font-size:.42em;letter-spacing:.32em;font-style:normal;font-family:'Big Shoulders Display';font-weight:900;color:var(--cool);text-shadow:none;margin-bottom:.15em}
.mbtns{display:flex;flex-direction:column;gap:12px;width:min(420px,92vw)}
.mbtn{border:2px solid var(--ink);border-radius:4px;padding:10px;font-size:28px;color:var(--ink);background:var(--deep);box-shadow:5px 5px 0 #000;transition:transform .12s,box-shadow .12s,background .12s}
.mbtn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--hot)}
.mbtn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
.mbtn.primary{background:var(--hot);color:var(--paperink);border-color:var(--paperink)}
.mbtn small{display:block;font-size:14px;color:inherit;opacity:.75;letter-spacing:.08em}
/* GAME */
.top{position:fixed;top:0;left:0;right:0;height:92px;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;background:linear-gradient(180deg,#0d0b12 0,#0d0b12 66%,rgba(13,11,18,0) 100%)}
.top>*{pointer-events:auto}
.fast{position:fixed;left:20px;top:20px;display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:4px;padding:7px 14px 7px 9px;font-size:17px;background:var(--deep);z-index:6;box-shadow:3px 3px 0 #000}
.tog{width:40px;height:22px;border-radius:3px;background:#3a2f45;position:relative;transition:.2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:2px;background:var(--ink);transition:.2s}
.fast.on .tog{background:var(--cool)}.fast.on .tog::after{left:21px;background:var(--paperink)}
.close{position:fixed;right:20px;top:20px;width:46px;height:46px;border-radius:4px;border:2px solid var(--ink);display:grid;place-items:center;font-size:20px;background:var(--deep);z-index:6;box-shadow:3px 3px 0 #000}
.close:hover{background:var(--hot);color:var(--paperink)}
.year{font-size:66px}.year.cat{font-size:44px;max-width:80vw;line-height:1.05}.year.cat.long{font-size:32px}.cgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))!important}.cgrid button{padding:10px 8px;line-height:1.15}.cgrid button small{display:block;font-size:11px;opacity:.75;margin-top:3px}.year.mon{font-size:54px}.pills.decs{margin-top:10px;box-shadow:4px 4px 0 var(--hot)}.pills.decs span{padding:4px 12px;font-size:17px}.pills span[data-game]{cursor:pointer}.mgrid{grid-template-columns:repeat(12,1fr)!important}
.sub{font-size:15px;color:var(--cool);text-align:center;margin-top:6px;letter-spacing:.2em}
.stage{padding:100px 24px 110px;max-width:1300px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 30px}
.card,.info,.cv{min-width:0}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}}
@media(max-width:600px){
 .v1{width:320px;height:320px}.v2{width:340px;height:340px}
 .top{height:118px;padding-top:54px}.year{font-size:42px}.year.mon{font-size:30px}.year.cat{font-size:24px}.year.cat.long{font-size:18px}.cgrid{grid-template-columns:repeat(2,1fr)!important}.mgrid{grid-template-columns:repeat(6,1fr)!important}
 .cv.playing{transform:none}
 .fast{top:14px;left:12px;font-size:15px;padding:6px 10px 6px 7px}.tog{width:34px;height:19px}.tog::after{width:13px;height:13px}.fast.on .tog::after{left:18px}
 .close{top:12px;right:12px;width:40px;height:40px}
 .stage{padding:120px 14px 130px}.page{padding:80px 14px 90px}
 .info{min-height:88px;padding:9px 6px 8px}.info .t{font-size:17px}.info .a{font-size:13px}.save{font-size:16px;padding:3px 20px}
 .pp{width:36px;height:36px;right:8px;bottom:8px}.pp svg{width:16px;height:16px}
 .yt{left:8px;bottom:10px;font-size:11px;height:22px;padding:0 6px}
 .credit{display:none}
 .prev{bottom:12px;left:10px;font-size:15px;padding:8px 12px}.prev .long{display:none}
 .mute button:not(.ic){display:none}
 .mute{right:10px;bottom:10px}.mute button{height:40px;font-size:15px}.mute .ic{width:40px}
 .dock{right:8px;bottom:62px}#ytp{width:300px;height:200px}.dockbar{max-width:300px}
 .menu h1{margin:34px 0 30px}.src span{min-width:0;font-size:17px;padding:9px 14px}
 .cv.playing .disc{transform:translateX(16%) rotate(0)}
}
.card{display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(14px);transition:opacity .35s,transform .35s}
.card.in{opacity:1;transform:none}
.stage .card:not(.in){pointer-events:none}
/* sleeve + record */
.cv{position:relative;aspect-ratio:1;border-radius:2px;padding:0;cursor:pointer;background:none;transition:transform .2s}
.cv img,.cv .ph{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;border-radius:2px;background:#221a2b;box-shadow:0 0 0 2px var(--ink),6px 6px 0 #000;transition:box-shadow .2s}
.cv .ph{display:grid;place-items:center;color:#6b5a7a;font-size:44px}
.cv:hover img{box-shadow:0 0 0 2px var(--ink),8px 8px 0 var(--plum)}
.disc{position:absolute;z-index:0;top:4%;left:4%;width:92%;height:92%;border-radius:50%;
 background:radial-gradient(circle,var(--paper) 0 2.2%,var(--hot) 2.6% 17%,#120d17 17.5% 19%,transparent 19.5%),
  conic-gradient(from 30deg,rgba(255,255,255,.16),rgba(255,255,255,0) 18%,rgba(255,255,255,.12) 50%,rgba(255,255,255,0) 68%,rgba(255,255,255,.16)),
  repeating-radial-gradient(circle,#2a2431 0 1.5px,#141018 1.5px 3.5px);
 box-shadow:0 0 0 2px var(--ink),4px 4px 0 #000;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.cv.playing .disc{transform:translateX(30%);animation:spin 2.2s linear infinite;animation-delay:.45s}
.cv.playing{transform:translateX(-6%)}
.cv.playing img{box-shadow:0 0 0 2px var(--hot),6px 6px 0 #000}
.pp{position:absolute;z-index:2;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:2px 2px 0 #000;border:2px solid var(--paperink)}
.pp svg{width:18px;height:18px;fill:var(--paperink);stroke:var(--paperink);stroke-width:2.2;stroke-linejoin:round}
.cv.playing .pp{background:var(--hot)}
.pp.na{opacity:.35}
.pp.ld svg{display:none}.pp.ld::after{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(26,18,32,.25);border-top-color:var(--paperink);animation:spin .8s linear infinite}
.yt{position:absolute;z-index:2;left:10px;bottom:12px;height:24px;padding:0 8px;border-radius:3px;background:var(--paperink);font-size:13px;display:grid;place-items:center;color:var(--cool);border:1.5px solid var(--cool);opacity:0;transition:.15s;letter-spacing:.08em}
.cv:hover .yt,.cv.playing .yt{opacity:1}
/* ticket stub */
.info{position:relative;border-radius:3px;background:var(--paper);color:var(--paperink);padding:11px 8px 9px;text-align:center;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
 -webkit-mask:radial-gradient(circle at 0 50%,transparent 7px,#000 7.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 7px,#000 7.5px) right/51% 100% no-repeat;
 mask:radial-gradient(circle at 0 50%,transparent 7px,#000 7.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 7px,#000 7.5px) right/51% 100% no-repeat}
.info::before{content:"";position:absolute;left:10px;right:10px;top:5px;border-top:2px dashed rgba(26,18,32,.25)}
.info .t{font-size:21px;color:var(--paperink);line-height:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-transform:uppercase}
.info .a{font-size:14px;color:#6b3f6e;line-height:1.1;letter-spacing:.08em;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;text-transform:uppercase}
.save{margin-top:6px;background:var(--hot);color:var(--paperink);font-size:18px;padding:3px 26px;border-radius:999px;border:2px solid var(--paperink);box-shadow:2px 2px 0 var(--paperink);transition:.12s;letter-spacing:.12em}
.save:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--paperink);background:var(--hot2)}
.save[disabled]{opacity:.35;pointer-events:none}
/* results */
.res .cv img{filter:grayscale(.6) brightness(.45)}
.res .cv.picked img{filter:none;box-shadow:0 0 0 3px var(--hot),6px 6px 0 #000}
.pct{position:absolute;z-index:2;inset:0;display:grid;place-content:center;font-size:clamp(36px,4.4vw,58px);color:var(--ink);text-shadow:3px 3px 0 #000;pointer-events:none;text-align:center;line-height:.9;font-weight:900}
.pct small{display:inline-block;font-size:13px;color:var(--paperink);background:var(--cool);padding:3px 8px;border-radius:2px;margin-top:8px;text-shadow:none;letter-spacing:.08em}
.res .cv.picked .pct small{background:var(--hot)}
.res .save{display:none}
.res .info{min-height:80px}
/* bottom bar */
.prev{position:fixed;left:14px;bottom:30px;border:2px solid var(--ink);border-radius:4px;padding:9px 16px;font-size:18px;color:var(--ink);background:var(--deep);display:block;white-space:nowrap;align-items:center;z-index:6;box-shadow:3px 3px 0 #000}
.prev:hover{background:var(--cool);color:var(--paperink)}
.prev[disabled]{opacity:.3;pointer-events:none}
.credit{position:fixed;left:14px;bottom:10px;font-size:11px;color:#8d7d99;z-index:6;letter-spacing:.12em}
.mute{position:fixed;right:20px;bottom:22px;display:flex;gap:10px;z-index:6}
.mute button{border:2px solid var(--ink);border-radius:4px;height:44px;padding:0 14px;font-size:17px;background:var(--deep);box-shadow:3px 3px 0 #000}
.mute .ic{width:44px;padding:0;display:grid;place-items:center}
.mute svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2}
/* modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,5,12,.72);padding:20px;backdrop-filter:blur(3px)}
.mbox{width:min(820px,92vw);min-height:420px;border:2px solid var(--ink);border-radius:4px;background:linear-gradient(160deg,#241532,#130d1b);box-shadow:10px 10px 0 var(--hot);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;text-align:center;gap:22px}
.mbox h2{font-size:58px}
.mbox p{font-size:22px;line-height:1.6;letter-spacing:.06em}
.mbox p b{color:var(--cool);font-weight:900}
/* lists */
.page{padding:96px 24px 80px;max-width:1150px;margin:0 auto;text-align:center}
.page h1{font-size:clamp(46px,7vw,76px)}
.page .lead{font-size:15px;color:var(--cool);margin:18px 0 30px;letter-spacing:.14em}
.decades{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;text-align:center}
.dcard{border-radius:3px;background:var(--paper);color:var(--paperink);padding:16px 14px;box-shadow:6px 6px 0 #000}
.dcard h3{font-family:'Fraunces',serif;font-style:italic;font-size:36px;color:var(--paperink);font-weight:900;margin-bottom:12px;text-shadow:2px 2px 0 var(--hot)}
.dcard img{width:72%;aspect-ratio:1;object-fit:cover;display:block;margin:0 auto 14px;box-shadow:4px 4px 0 var(--paperink)}
.dcard .t{font-size:16px}
.dcard .m{font-size:13px;color:#6b3f6e;margin-top:8px}
.ygrid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-bottom:22px}
@media(max-width:700px){.ygrid{grid-template-columns:repeat(5,1fr)}}
.ygrid button{border:2px solid var(--ink);border-radius:3px;padding:9px 0;font-size:22px;color:var(--ink);background:var(--deep);box-shadow:3px 3px 0 #000;transition:.12s}
.ygrid button.done{background:var(--cool);color:var(--paperink)}
.ygrid button:hover{background:var(--hot);color:var(--paperink);transform:translate(-1px,-1px)}
.dlabel{text-align:left;font-family:'Fraunces',serif;font-style:italic;font-weight:900;font-size:30px;color:var(--ink);margin:10px 0 10px;text-shadow:2px 2px 0 var(--plum)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;text-align:center}
.pk .y{font-size:22px;color:var(--hot);margin-top:12px}
.pk .t{font-size:18px;line-height:1.05}
.pk .a{font-size:13px;color:#b9a8c4;letter-spacing:.08em}
.corner{position:fixed;right:20px;bottom:22px;display:flex;gap:10px;z-index:6}
.cbtn.hot{background:var(--hot);color:var(--paperink)}.sharebox{min-height:0;gap:14px;max-height:92vh;overflow:auto}.shprev img{max-width:100%;max-height:46vh;border:2px solid var(--ink);display:block;margin:0 auto}.shbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.shbtns .mbtn{font-size:20px;padding:8px 18px;width:auto}.shurl{width:100%;font:inherit;font-size:14px;padding:8px;background:#0d0b12;color:var(--ink);border:1px solid #555;border-radius:3px}
.cbtn{border:2px solid var(--ink);border-radius:4px;padding:9px 16px;font-size:17px;color:var(--ink);background:var(--deep);box-shadow:3px 3px 0 #000}
.cbtn:hover{background:var(--hot);color:var(--paperink)}
/* deathmatch */
.dm{display:flex;gap:40px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:24px}
.dm .card{width:min(300px,78vw)}
.vs{font-family:'Fraunces',serif;font-style:italic;font-weight:900;font-size:60px;color:var(--ink);align-self:center;text-shadow:3px 3px 0 var(--hot),6px 6px 0 var(--plum)}
.dmwrap .mbtns{margin:26px auto 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--cool);color:var(--paperink);padding:10px 18px;border-radius:3px;font-size:19px;opacity:0;transition:.25s;z-index:30;pointer-events:none;border:2px solid var(--paperink);box-shadow:4px 4px 0 #000;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.hint{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);font-size:15px;color:#bbb;z-index:5;text-align:center}
.dock{position:fixed;right:20px;bottom:80px;transform:translateX(130%);z-index:15;border:2px solid var(--ink);border-radius:4px;background:#0d0b12;overflow:hidden;transition:transform .3s;box-shadow:6px 6px 0 var(--hot)}
.dock.on{transform:none}
body.docked .stage,body.docked .page{padding-bottom:330px}
.dockbar{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:14px;color:var(--paperink);background:var(--paper);max-width:356px;letter-spacing:.06em}
.dockbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dockbar button{font-size:15px;color:var(--paperink)}
#ytp{display:block;width:356px;height:200px}
.modal.keym{display:none}.modal.keym.on{display:grid}
#keyin{width:min(520px,80vw);background:#0b0910;border:2px solid var(--ink);border-radius:3px;color:#fff;font:18px ui-monospace,monospace;padding:12px;letter-spacing:0}
.skipbar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:12px;z-index:7}
.skipbar button{white-space:nowrap;border:2px solid var(--paperink);border-radius:999px;padding:8px 22px;font-size:20px;color:var(--paperink);background:var(--hot);box-shadow:4px 4px 0 #000;letter-spacing:.1em}
.skipbar button+button{background:var(--paper)}
.skipbar button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
@media(max-width:600px){.skipbar{bottom:64px}.skipbar button{font-size:16px;padding:7px 14px}}
</style>
</head>
<body>
<div class="bg"><div class="vinyl v1"></div><div class="vinyl v2"></div></div>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="dock" id="dock"><div class="dockbar"><span id="dockt"></span><button id="dockx" aria-label="Stop">✕</button></div><div id="ytp"></div></div>
<div class="modal keym" id="keymodal"><div class="mbox" style="min-height:0;gap:14px">
  <h2 class="gold-title" style="font-size:44px">YOUTUBE KEY</h2>
  <p style="font-size:18px;line-height:1.5">OPTIONAL: PASTE A FREE YOUTUBE DATA API KEY TO PLAY FULL SONGS ON THE PAGE. WITHOUT ONE, FULL SONG OPENS YOUTUBE IN A NEW TAB.<br>IT'S SAVED ONLY IN THIS BROWSER. FOUND VIDEOS ARE REMEMBERED, SO EACH SONG IS ONLY SEARCHED ONCE.</p>
  <input id="keyin" placeholder="AIza..." autocomplete="off" spellcheck="false">
  <div style="display:flex;gap:10px"><button class="mbtn primary" id="keysave" style="font-size:22px;padding:8px 30px">SAVE</button><button class="mbtn" id="keyclose" style="font-size:22px;padding:8px 30px">CLOSE</button></div>
</div></div>
<script>
/* moved to save-one-song.pages.dev: forward visitors from the old GitHub address and bring their saved picks along */
(function(){const NEW='https://save-one-song.pages.dev/';
 if(location.hostname.endsWith('github.io')){const d={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('sos2-')&&!/vids2|dzfound|ytkey/.test(k))d[k]=localStorage.getItem(k)}}catch(e){}
   let h='';try{h=Object.keys(d).length?'#import='+btoa(unescape(encodeURIComponent(JSON.stringify(d)))):''}catch(e){}
   location.replace(NEW+location.search+h);throw new Error('moved')}

const isAlbumRounds=t=>t==='genre'||t==='scene';
function catRounds(t,c,multi){
  if(!isAlbumRounds(t))return c.rounds;
  const out=[];
  for(const [yr,albums] of c.rounds){
    let songs;
    if(!multi){if(albums.length<(t==='genre'?5:3))continue;songs=albums.map(([al,ar,img,y,tr])=>{const x=tr[0];return [x[0],ar,al,img,x[1],x[2],x[3]||0,y]})}
    else{const all=[];albums.forEach(([al,ar,img,y,tr],ai)=>tr.forEach((x,ti)=>all.push([[x[0],ar,al,img,x[1],x[2],x[3]||0,y],ai,ti])));
      all.sort((a,b)=>b[0][4]-a[0][4]||b[0][5]-a[0][5]);songs=all.slice(0,10).sort((a,b)=>a[1]-b[1]||a[2]-b[2]).map(x=>x[0]);if(songs.length<5)continue}
    out.push([yr,yr,songs])}
  return out;
}
const catMulti=()=>store.get('catmulti',false);
let catTab='genre';
function catsHTML(){
  const list=CATDATA[catTab];
  return `${chrome()}<div class="page"><h1 class="gold-title">CATEGORIES</h1>
    <div class="pills" style="margin:0 auto 26px;width:max-content">${CATTYPES.map(([t,n])=>`<span class="${t===catTab?'on':''}" data-cattab="${t}">${n}</span>`).join('')}</div>
    <p class="lead">${({genre:'EACH ROUND IS ONE YEAR OF THE GENRE, FROM ITS 10 TOP-RATED ALBUMS: THE BEST TRACK OF EACH, OR THE 10 BEST TRACKS OVERALL',scene:'EACH ROUND IS ONE YEAR OF THE SCENE, FROM ITS 10 TOP-RATED ALBUMS: THE BEST TRACK OF EACH, OR THE 10 BEST TRACKS OVERALL',artist:'EACH ROUND IS ONE OF THE ARTIST\'S ALBUMS: SAVE YOUR FAVOURITE TRACK',album:'EACH ROUND IS ONE ACCLAIMED ALBUM: SAVE YOUR FAVOURITE TRACK'})[catTab]}</p>
    ${isAlbumRounds(catTab)?`<div class="pills decs" style="margin:0 auto 22px;width:max-content"><span class="${catMulti()?'':'on'}" data-catmulti="0">ONE SONG PER ALBUM</span><span class="${catMulti()?'on':''}" data-catmulti="1">MULTIPLE SONGS PER ALBUM</span></div>`:''}
    ${list?`<div class="ygrid cgrid">${list.map(c=>{const m=isAlbumRounds(catTab)&&catMulti();const id='c:'+catTab+':'+c.id+(m?':multi':'');const n=Object.keys(store.get('picks-'+id,{})).length;const r=catRounds(catTab,c,m).length;if(!r)return '';return `<button class="${GAME===id?'done':''}" data-game="${id}">${esc(c.name)}<small>${n?n+' / ':''}${r} ROUNDS</small></button>`}).join('')}</div>`:`<p class="lead">LOADING…</p>`}</div>`;
}
async function openCats(t){catTab=t||catTab;view='cats';render();if(!CATDATA[catTab]){try{CATDATA[catTab]=await (await fetch('cat-'+catTab+'.json?v=50')).json()}catch(e){toast('COULD NOT LOAD CATEGORY DATA')}if(view==='cats')render()}}
function chrome(){return `<button class="close" data-go="menu" aria-label="Close">✕</button>`}
function gameHTML(){
  const y=YEARS[yi], res=phase==='results';
  const pickedId=picks[y]!=null?y+'-'+picks[y]:null;
  const cards=RAW[y].map((_,i)=>{const s=SONGS[y+'-'+i];const shown=fast||res||i<revealed;
    const pct=res?`<div class="pct">${s.sc}<small>${s.n?s.n.toLocaleString()+' RATINGS':'AOTY SCORE'}</small></div>`:'';
    return `<div class="card ${shown?'in':''}" data-i="${i}">${coverEl(s,pct).replace('class="cv"',`class="cv ${pickedId===s.id&&res?'picked':''}"`)}
      <div class="info"><div class="t" title="${esc(s.t)}">${esc(s.t)}</div><div class="a" title="${esc(s.a)}">${esc(s.a)}</div><button class="save" data-save="${i}">SAVE</button></div></div>`}).join('');
  return `<div class="fast ${fast?'on':''}" data-fast><div class="tog"></div>FAST MODE</div>
    ${chrome()}
    <div class="top"><div>${res?`<div class="year gold-title" style="font-size:46px">AOTY Scores</div><div class="sub">CLICK TO CONTINUE</div>`:`<div class="year gold-title ${isMonthKey(y)?'mon':''} ${isCatKey(y)?(label(y).length>22?'cat long':'cat'):''}">${esc(label(y))}</div>`}</div></div>
    <div class="stage ${res?'res':''}" id="stage"><div class="grid">${cards}</div></div>
    ${phase==='reveal'&&!fast&&!res?`<div class="skipbar"><button data-skip>SKIP ▸</button><button data-skipall>SKIP ALL</button></div>`:''}<div class="credit">SONGS FROM ALBUMOFTHEYEAR.ORG · ${KIND()==='cat'?esc(CATNAME).toUpperCase():(GAME==='year'?(y<2000?'200':'500'):'100')+'+ RATINGS'}${KIND()==='month'?' · BY ALBUM RELEASE DATE':''} · CLIPS VIA DEEZER · FULL SONGS VIA YOUTUBE</div><button class="prev" data-prev ${yi===0?'disabled':''}>← PREV<span class="long">IOUS ${UNIT()}</span></button>
    <div class="mute"><button data-mute>${muted?'UNMUTE':'MUTE'} MUSIC</button><button class="ic" data-mute>${muted?ICON.spkoff:ICON.spk}</button></div>
    ${!seenTip?`<div class="modal" data-tip><div class="mbox"><h2 class="gold-title">DID YOU KNOW?</h2><p>${TOUCH?'USE <b>SKIP</b> TO MOVE TO THE NEXT PREVIEW, OR <b>SKIP ALL</b>.<br>ONCE ALL CARDS APPEAR, TAP A COVER TO PLAY OR PAUSE.<br>CHOOSE <b>SAVE</b> TO KEEP THAT SONG.':'CLICK OR PRESS <b>SKIP</b> FOR THE NEXT PREVIEW. HOLD LEFT CLICK TO SKIP SILENTLY.<br>ONCE ALL CARDS APPEAR, CLICK A COVER TO PLAY OR PAUSE.<br>CHOOSE <b>SAVE</b> TO KEEP THAT SONG. SPACE PAUSES.'}</p></div></div>`:''}`;
}
function yearsHTML(){
  if(KIND()==='cat')return `${chrome()}<div class="page"><h1 class="gold-title">SKIP TO ROUND</h1><p class="lead">${esc(CATNAME).toUpperCase()} · TEAL ROUNDS ALREADY HAVE A SAVED SONG</p><div class="ygrid cgrid">${YEARS.map(y=>`<button class="${picks[y]!=null?'done':''}" data-year="${esc(y)}">${esc(label(y))}</button>`).join('')}</div></div>`;
  const M=GAME!=='year';const grp=y=>M?y.slice(0,4):Math.floor(y/10)*10+'S';
  const decs={};YEARS.forEach(y=>{(decs[grp(y)]=decs[grp(y)]||[]).push(y)});
  return `${chrome()}<div class="page"><h1 class="gold-title">SKIP TO ${M?'MONTH':'YEAR'}</h1><p class="lead">TEAL ${M?'MONTHS':'YEARS'} ALREADY HAVE A SAVED SONG</p>
    ${Object.keys(decs).map(d=>`<div class="dlabel">${d}</div><div class="ygrid ${M?'mgrid':''}">${decs[d].map(y=>`<button class="${picks[y]!=null?'done':''}" data-year="${y}">${M?MONTHN[+y.slice(5)-1].slice(0,3):y}</button>`).join('')}</div>`).join('')}</div>`;
}
function rankHTML(){
  const M=GAME!=='year';const decs={};YEARS.forEach(y=>RAW[y].forEach((_,i)=>{const s=SONGS[y+'-'+i];const d=M?y.slice(0,4):Math.floor(y/10)*10+'S';if(!decs[d]||s.n>decs[d].n)decs[d]=s}));
  return `${chrome()}<div class="page"><h1 class="gold-title">GLOBAL RANKINGS</h1><p class="lead">${M?'YEAR':'DECADE'} LEADERS BY TOTAL AOTY RATINGS, FROM THIS LINEUP.</p>
    <div class="decades">${Object.keys(decs).map(d=>{const s=decs[d];return `<div class="dcard"><h3>${d}</h3><img referrerpolicy="no-referrer" src="${COVER(s)}" alt=""><div class="t">${esc(s.t)} - ${esc(s.a)}</div><div class="m">${s.y} · ${s.n.toLocaleString()} RATINGS · ${s.sc}</div></div>`}).join('')}</div></div>`;
}
function picksHTML(){
  const ys=YEARS.filter(y=>picks[y]!=null);
  return `${chrome()}<div class="page"><h1 class="gold-title">YOUR PICKS</h1><p class="lead">${ys.length} OF ${YEARS.length} ${UNIT()}S SAVED${ys.length?' · CLICK A COVER TO PLAY':''}</p>
    ${ys.length?`<div class="picks">${ys.map(y=>{const s=SONGS[y+'-'+picks[y]];return `<div class="pk">${coverEl(s)}<div class="y">${shortLabel(y)}</div><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)}</div></div>`}).join('')}</div>`:`<div class="mbtns" style="margin:0 auto"><button class="mbtn primary" data-go="new">START SAVING</button></div>`}</div>
    <div class="corner">${ys.length?`<button class="cbtn hot" data-share>SHARE</button><button class="cbtn" data-copy>COPY LIST</button><button class="cbtn" data-clear>CLEAR ALL</button>`:''}</div>`;
}
/* ---------- deathmatch ---------- */
let dm=null;
function dmStart(){const pool=YEARS.filter(y=>picks[y]!=null).map(y=>y+'-'+picks[y]);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}dm={round:pool,next:[],idx:0,rn:1};dmFixBye()}
function dmFixBye(){if(dm.idx>=dm.round.length-1){if(dm.idx===dm.round.length-1)dm.next.push(dm.round[dm.idx]);dm.round=dm.next;dm.next=[];dm.idx=0;dm.rn++;}}
function dmHTML(){
  const n=YEARS.filter(y=>picks[y]!=null).length;
  if(!dm||dm.done||dm.round.length<2){
    if(dm&&dm.round.length===1){const champ=dm.round[0];const h=store.get(gk('champs'),[]);h.push(champ);store.set(gk('champs'),h);dm={done:champ}}
    if(dm&&dm.done){const s=SONGS[dm.done];return `${chrome()}<div class="page dmwrap"><h1 class="gold-title">LAST ONE STANDING</h1><p class="lead">YOUR CHAMPION</p><div class="dm"><div class="card in">${coverEl(s)}<div class="info"><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)} · ${s.y}</div></div></div></div><div class="mbtns"><button class="mbtn primary" data-dmstart>RUN IT BACK</button><button class="mbtn" data-go="dmrank">DEATHMATCH RANKINGS</button></div></div>`}
    return `${chrome()}<div class="page dmwrap" style="padding-top:140px"><h1 class="gold-title">LAST ONE<br>STANDING</h1><p class="lead" style="max-width:560px;margin:22px auto">YOUR TOP PICK FROM EACH ${UNIT()} GETS SHUFFLED INTO HEAD-TO-HEAD ROUNDS. KEEP CHOOSING UNTIL ONLY ONE IS LEFT STANDING.</p><p class="lead">${n} ${({year:'YEARLY',month:'MONTHLY',cat:'ROUND'})[KIND()]} PICKS SAVED</p>
      <div class="mbtns"><button class="mbtn primary" data-dmstart ${n<2?'disabled style="opacity:.4"':''}>START DEATHMATCH</button><button class="mbtn" data-go="dmrank">DEATHMATCH RANKINGS</button></div></div>
      <div class="corner">${store.get(gk('champs'),[]).length?`<button class="cbtn" data-dmclear>CLEAR ALL</button>`:''}</div>`;
  }
  const a=SONGS[dm.round[dm.idx]],b=SONGS[dm.round[dm.idx+1]];
  const left=dm.round.length-dm.idx+dm.next.length;
  const side=(s,k)=>`<div class="card in">${coverEl(s)}<div class="info"><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)} · ${s.y}</div><button class="save" data-dmpick="${k}">KEEP</button></div></div>`;
  return `${chrome()}<div class="page"><h1 class="gold-title" style="font-size:48px">ROUND ${dm.rn}</h1><p class="lead">${left} SONGS LEFT STANDING</p><div class="dm">${side(a,0)}<div class="vs">VS</div>${side(b,1)}</div></div>`;
}
function dmRankHTML(){
  const h=store.get(gk('champs'),[]);const c={};h.forEach(id=>c[id]=(c[id]||0)+1);const list=Object.keys(c).filter(id=>SONGS[id]).sort((x,y)=>c[y]-c[x]);
  return `${chrome()}<div class="page"><h1 class="gold-title">DEATHMATCH RANKINGS</h1><p class="lead">YOUR CHAMPIONS BY WINS</p>
   ${list.length?`<div class="picks">${list.map(id=>{const s=SONGS[id];return `<div class="pk">${coverEl(s)}<div class="y">${c[id]} WIN${c[id]>1?'S':''}</div><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)} · ${s.y}</div></div>`}).join('')}</div>`:'<p class="lead">NO CHAMPIONS YET</p>'}</div>`;
}

/* ---------- game flow ---------- */
function enterYear(i){
  yi=Math.max(0,Math.min(YEARS.length-1,i));revealed=0;phase='reveal';stopAudio();view='game';store.set(gk('yi'),yi);
  render();preloadYear(YEARS[yi]);setTimeout(()=>{if(YEARS[yi+1])RAW[YEARS[yi+1]].forEach((_,i)=>urlFor(YEARS[yi+1]+'-'+i))},4000);
  if(seenTip&&!fast)setTimeout(advance,350);
}
function advance(){
  if(view!=='game'||phase!=='reveal'||fast)return;
  clearTimeout(revealTimer);
  if(revealed>=RAW[YEARS[yi]].length){phase='choose';stopAudio();hideSkip();return}
  revealed++;const card=document.querySelector(`.card[data-i="${revealed-1}"]`);if(card)card.classList.add('in');
  const s=SONGS[YEARS[yi]+'-'+(revealed-1)];
  play(s.id);
  revealTimer=setTimeout(advance,CLIP_MS);
}
function hideSkip(){const b=document.querySelector('.skipbar');if(b)b.remove()}
function revealAll(silent){clearTimeout(revealTimer);revealed=RAW[YEARS[yi]].length;phase='choose';hideSkip();if(silent)stopAudio();document.querySelectorAll('.card').forEach(c=>c.classList.add('in'))}
function save(i){
  const y=YEARS[yi];picks[y]=i;store.set(gk('picks'),picks);clearTimeout(revealTimer);hideSkip();phase='results';resultsFor=y;render();
  // keep the chosen song playing (its whole clip) until the player moves on
  const id=y+'-'+i;
  if(playing===id&&!isPaused())markPlaying();else play(id);
}
function afterResults(){
  const next=YEARS.findIndex((y,i)=>i>yi&&picks[y]==null);
  if(yi<YEARS.length-1){enterYear(yi+1)}else{view='picks';render();toast(next<0?'ALL '+UNIT()+'S SAVED — TRY DEATHMATCH':'END OF THE LINE')}
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(phase==='reveal'){stopAudio(false);advance()}});
  document.querySelectorAll('[data-skipall]').forEach(b=>b.onclick=e=>{e.stopPropagation();revealAll(true)});
  document.querySelectorAll('[data-key]').forEach(b=>b.onclick=e=>{e.stopPropagation();openKey()});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.stopPropagation();const g=b.dataset.go;stopAudio();
    if(g==='menu'){view='menu';render()}
    else if(g==='new'){if(Object.keys(picks).length&&!b.dataset.armed){b.dataset.armed=1;b.innerHTML='NEW<small>CLICK AGAIN — THIS CLEARS YOUR PICKS</small>';return}picks={};store.set(gk('picks'),picks);enterYear(0)}
    else if(g==='continue'){const f=YEARS.findIndex(y=>picks[y]==null);enterYear(f<0?0:f)}
    else{view=g;if(g==='dm')dm=null;render()}});
  document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>enterYear(YEARS.findIndex(y=>String(y)===b.dataset.year)));
  document.querySelectorAll('[data-game]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const g=b.dataset.game;if(g===GAME){if(view==='cats'){view='menu';render()}return}if(/^\d{4}s$/.test(g))store.set('lastdec',g);b.textContent='LOADING…';if(await setGame(g)){view='menu';render()}else render()});
  document.querySelectorAll('[data-gocats]').forEach(b=>b.onclick=e=>{e.stopPropagation();openCats(GAME.startsWith('c:')?GAME.split(':')[1]:null)});
  document.querySelectorAll('[data-catmulti]').forEach(b=>b.onclick=e=>{e.stopPropagation();store.set('catmulti',b.dataset.catmulti==='1');render()});
  document.querySelectorAll('[data-cattab]').forEach(b=>b.onclick=e=>{e.stopPropagation();openCats(b.dataset.cattab)});
  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.play;if(view==='game'&&phase==='reveal'){if(TOUCH)return;revealAll(false)}
    if(playing===id){togglePause()}else play(id)});
  document.querySelectorAll('[data-full]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.full;if(view==='game'&&phase==='reveal'){if(TOUCH)return;revealAll(true)}ytPlay(id,true)});
  document.querySelectorAll('.cv').forEach(c=>c.addEventListener('click',e=>{if(e.target.closest('[data-full],[data-play]'))return;const b=c.querySelector('[data-play]');if(b&&!(view==='game'&&phase==='results'))b.click()}));
  
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();save(+b.dataset.save)});
  const f=document.querySelector('[data-fast]');if(f)f.onclick=e=>{e.stopPropagation();fast=!fast;store.set('fast',fast);if(fast){revealAll(true)}f.classList.toggle('on',fast);if(!fast&&phase==='reveal'){revealed=0;render();advance()}};
  const p=document.querySelector('[data-prev]');if(p)p.onclick=e=>{e.stopPropagation();enterYear(yi-1)};
  document.querySelectorAll('[data-mute]').forEach(b=>b.onclick=e=>{e.stopPropagation();muted=!muted;store.set('muted',muted);applyMute();const m=document.querySelectorAll('.mute button');m[0].textContent=(muted?'UNMUTE':'MUTE')+' MUSIC';m[1].innerHTML=muted?ICON.spkoff:ICON.spk});
  const tip=document.querySelector('[data-tip]');if(tip)tip.onclick=e=>{e.stopPropagation();seenTip=true;store.set('tip',true);tip.remove();if(!fast)advance()};
  const cp=document.querySelector('[data-copy]');if(cp)cp.onclick=async()=>{const lines=['SAVE ONE SONG — MY PICKS'+(KIND()==='month'?' — THE '+GAME.toUpperCase():KIND()==='cat'?' — '+CATNAME.toUpperCase():'')];YEARS.forEach(y=>{if(picks[y]!=null){const s=SONGS[y+'-'+picks[y]];lines.push(`${shortLabel(y)}  ${s.t} — ${s.a}`)}});try{await navigator.clipboard.writeText(lines.join('\n'));toast('COPIED')}catch(e){toast('COPY BLOCKED BY BROWSER')}};
  const cl=document.querySelector('[data-clear]');if(cl)cl.onclick=()=>{if(cl.dataset.armed){picks={};store.set(gk('picks'),picks);render();toast('PICKS CLEARED')}else{cl.dataset.armed=1;cl.textContent='CLICK AGAIN TO CLEAR';setTimeout(()=>{if(cl.isConnected){delete cl.dataset.armed;cl.textContent='CLEAR ALL'}},2500)}};
  const sh=document.querySelector('[data-share]');if(sh)sh.onclick=e=>{e.stopPropagation();openShare()};
  const dmc=document.querySelector('[data-dmclear]');if(dmc)dmc.onclick=()=>{store.set(gk('champs'),[]);render();toast('DEATHMATCH HISTORY CLEARED')};
  document.querySelectorAll('[data-dmstart]').forEach(b=>b.onclick=()=>{if(YEARS.filter(y=>picks[y]!=null).length<2)return;dmStart();render()});
  document.querySelectorAll('[data-dmpick]').forEach(b=>b.onclick=e=>{e.stopPropagation();stopAudio();dm.next.push(dm.round[dm.idx+ +b.dataset.dmpick]);dm.idx+=2;dmFixBye();render()});
}
// stage clicks: skip preview (click) / skip silently (hold); continue after results
let holdT=null,held=false;
document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||view!=='game'||phase!=='reveal'||e.target.closest('button,a,.cv,[data-fast],.modal,.dock'))return;held=false;holdT=setTimeout(()=>{held=true;revealAll(true)},450)});
document.addEventListener('pointerup',e=>{clearTimeout(holdT);if(view!=='game'||e.target.closest('button,a,[data-fast],.modal,.dock'))return;
  if(phase==='results'){afterResults();return}
  if(phase==='reveal'&&!held&&e.pointerType!=='touch'&&!e.target.closest('.cv')){stopAudio(false);advance()}});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();togglePause()}
  if(view==='game'&&phase==='results'&&(e.key==='Enter'||e.key==='ArrowRight'))afterResults();
  if(e.key==='Escape'&&$('#sharemodal')){$('#sharemodal').remove();return}
  if(e.key==='Escape'&&!$('#keymodal').classList.contains('on')){stopAudio();view='menu';render()}
});
$('#keysave').onclick=()=>{YTKEY=$('#keyin').value.trim();store.set('ytkey',YTKEY);quotaOut=false;$('#keymodal').classList.remove('on');toast(YTKEY?'KEY SAVED':'KEY CLEARED');if(view==='menu')render()};
$('#keyclose').onclick=()=>$('#keymodal').classList.remove('on');
$('#keyin').onkeydown=e=>{if(e.key==='Enter')$('#keysave').click()};
$('#dockx').onclick=()=>{
  // only stop YouTube; leave a Deezer clip that's playing alone
  clearTimeout(kick);if(ytReady)ytp.stopVideo();ytPaused=true;
  if(mode==='yt'&&playing){setLoading(playing,false);playing=null;markPlaying()}
  $('#dock').classList.remove('on');document.body.classList.remove('docked')};
yi=Math.min(store.get('yi',0),YEARS.length-1);
(async()=>{const q=new URLSearchParams(location.search);
  if(q.get('p')!=null&&q.get('g')){const g=q.get('g');if(g==='year'||await setGame(g)){if(g==='year'&&GAME!=='year')await setGame('year');
    SHARED={};(q.get('p')||'').replace(/-([0-9a-z])/g,(m,c)=>'_'.repeat(B36.indexOf(c))).split('').forEach((ch,i)=>{const n=B36.indexOf(ch);if(n>=0&&YEARS[i]!=null)SHARED[YEARS[i]]=n});view='shared';render();
    history.replaceState(null,'',location.pathname);return}}
  const g=store.get('game','year');if(g!=='year'){await setGame(g)}render()})();
</script>
